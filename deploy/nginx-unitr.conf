# Фрагмент конфигурации nginx для unitr.ru: раздел «Статьи», карта сайта и robots.txt обслуживает
# Node.js-приложение (127.0.0.1:3000), остальные адреса — существующий сайт.
# Вставить внутрь server { ... } сайта unitr.ru ПЕРЕД location / существующего сайта.

# --- раздел и его служебные файлы ---
location = /articles            { proxy_pass http://unitr_articles; }   # 301 → /articles/ делает приложение
location ^~ /articles/          { proxy_pass http://unitr_articles; }
location = /sitemap.xml         { proxy_pass http://unitr_articles; }
location ^~ /sitemaps/          { proxy_pass http://unitr_articles; }
location = /robots.txt          { proxy_pass http://unitr_articles; }
location ^~ /_next/             { proxy_pass http://unitr_articles; }
location ^~ /covers/            { proxy_pass http://unitr_articles; }   # только для демо-данных
location = /favicon.svg         { proxy_pass http://unitr_articles; }
location = /og-default.jpg      { proxy_pass http://unitr_articles; }
location = /logo-unitr.png      { proxy_pass http://unitr_articles; }
location ^~ /api/revalidate/    { proxy_pass http://unitr_articles; }
location ^~ /api/articles/      { proxy_pass http://unitr_articles; }

# --- старые адреса раздела: 301 делает приложение (с сохранением адреса статьи) ---
location ~ ^/(blog|poleznye-stati)(/|$) { proxy_pass http://unitr_articles; }

# Общие параметры проксирования (можно вынести в http { } / include)
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# В блоке http { }:
# upstream unitr_articles { server 127.0.0.1:3000; keepalive 16; }
#
# ВАЖНО: в существующих правилах сайта не должно быть
#   - add_header X-Robots-Tag "noindex..." для этих адресов;
#   - try_files ... /index.html, перехватывающего /articles/ (из-за него сейчас SPA отдаёт 200 вместо 404).
