# Вариант А на сервере с Apache вместо nginx (VPS с root): раздел обслуживает Node.js-приложение (127.0.0.1:3000),
# остальное — существующий сайт. Вставить в <VirtualHost> сайта unitr.ru (и :80, и :443), ДО правил SPA.
# Нужны модули: a2enmod proxy proxy_http headers && systemctl reload apache2
#
# На виртуальном хостинге без доступа к конфигурации Apache этот вариант недоступен — используйте вариант Б
# (статическая выкладка + .htaccess, docs/RUNBOOK.md).

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https" env=HTTPS

# раздел и его служебные адреса (обе формы — со слешем и без: 301 на слеш делает приложение)
ProxyPass        /articles        http://127.0.0.1:3000/articles
ProxyPassReverse /articles        http://127.0.0.1:3000/articles
ProxyPass        /sitemap.xml     http://127.0.0.1:3000/sitemap.xml
ProxyPass        /sitemaps/       http://127.0.0.1:3000/sitemaps/
ProxyPass        /robots.txt      http://127.0.0.1:3000/robots.txt
ProxyPass        /_next/          http://127.0.0.1:3000/_next/
ProxyPass        /api/revalidate/ http://127.0.0.1:3000/api/revalidate/
ProxyPass        /api/articles/   http://127.0.0.1:3000/api/articles/

# старые адреса раздела: 301 с сохранением адреса статьи делает приложение
ProxyPassMatch   ^/(blog|poleznye-stati)(/.*)?$ http://127.0.0.1:3000/$1$2

# ВАЖНО: правила SPA вида «RewriteRule . /index.html» не должны перехватывать эти адреса.
# ProxyPass обрабатывается раньше mod_rewrite в контексте <Directory>/.htaccess, но если RewriteRule задан
# в самом <VirtualHost>, добавьте перед ним:
#   RewriteCond %{REQUEST_URI} !^/(articles|sitemap\.xml|sitemaps/|robots\.txt|_next/|api/revalidate/|api/articles/|blog|poleznye-stati)
