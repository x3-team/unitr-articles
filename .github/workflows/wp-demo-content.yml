# Операции с WordPress (manage.unitr.ru) для раздела «Статьи» — через WP-CLI по SSH. Боевой unitr.ru не затрагивается.
#   backup        — резервная копия www/unitr.ru, БД и файлов WordPress в ~/backups/<метка> (deploy/hosting/backup.sh);
#   seed / status / remove — тестовые статьи в poleznye-stati (12 опубликованных + черновик, метка test-unitr-demo);
#   check         — самопроверка WordPress (только чтение): плагины, рубрика, поля статей, GraphQL;
#   scenario      — ручные пункты Прил. № 4 на тестовых статьях: изменения в WordPress → выкладка на стенд →
#                   проверка (scripts/check-scenario.mjs) → откат изменений → выкладка;
#   post-show     — текст и поля записи post_id (для подготовки отрывка и SEO-полей);
#   seo-fill      — отрывок и SEO-поля из deploy/hosting/seo-fill.json (только пустые поля);
#   plugin-update — обновить плагин раздела из wp/unitr-articles (настройки сохраняются);
#   measure       — замер автообновления: статья post_id пересохраняется в WordPress (текст не меняется), событие
#                   уходит в GitHub; время до новой даты изменения на боевом unitr.ru и в sitemap.xml;
#   frontend      — адрес сайта в плагине: https://unitr.ru (настройки раздела и UNITR_FRONTEND_URL в wp-config.php);
#   rest          — REST API WordPress: кто закрывает его анонимам (плагины, фильтры), доступны ли пароли приложений;
#                   запросы без авторизации и с паролем приложения сборки (secrets.WP_GRAPHQL_TOKEN): чтение, создание
#                   черновика и его удаление. В лог — только коды ответов;
#   dispatch-setup — пересборка стенда сразу после изменений в WordPress: репозиторий и токен из
#                   secrets.WP_DISPATCH_TOKEN (fine-grained, Contents: Read and write на этот репозиторий);
#                   событие из WordPress обновляет стенд и, после апрува (vars.PROD_APPROVED=yes), боевой unitr.ru.
# После seed/remove/seo-fill запускается выкладка раздела на стенд. В лог (репозиторий публичный) выводятся
# только счётчики, ярлыки статей и PASS/FAIL.
name: WP test content (manage.unitr.ru)

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [status, check, backup, seed, remove, scenario, post-show, seo-fill, plugin-update, frontend, dispatch-setup, measure, rest]
        default: status
      post_id:
        description: ID записи (для post-show)
        type: string
        default: ""
      allow_spa:
        description: seed — загрузить, даже если боевой SPA упоминает рубрику poleznye-stati (только после согласования)
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: wp-demo-content
  cancel-in-progress: false

jobs:
  content:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.HOSTING_SSH_PASSWORD }}
      SSH_HOST: ${{ secrets.HOSTING_SSH_HOST }}
      SSH_USER: ${{ secrets.HOSTING_SSH_USER }}
      ACTION: ${{ inputs.action }}
      GH_TOKEN: ${{ github.token }}
      SITE_URL: ${{ vars.STAND_URL || 'https://test.unitr.ru' }}
    steps:
      - name: Тестовые статьи — только до боевого выката
        # после апрува боевой unitr.ru собирается из той же рубрики WordPress: тестовые статьи попали бы на бой
        if: contains(fromJSON('["seed","scenario"]'), inputs.action) && vars.PROD_APPROVED == 'yes'
        run: |
          echo "::error::Боевой unitr.ru обновляется из WordPress (PROD_APPROVED=yes): seed и scenario отключены"
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y -q lftp sshpass >/dev/null
      - name: Файлы для хостинга
        run: |
          node --import tsx scripts/wp-demo-export.ts out-demo 12
          cp deploy/hosting/wp-demo-content.php deploy/hosting/wp-stand-scenario.php deploy/hosting/wp-demo-content.sh deploy/hosting/seo-fill.json deploy/hosting/backup.sh out-demo/
          (cd wp && zip -qr -X ../out-demo/unitr-articles-wp-plugin.zip unitr-articles)
      - name: Загрузка на хостинг
        run: |
          lftp -u "$SSH_USER,$SSHPASS" -e "set sftp:auto-confirm yes; set cmd:fail-exit yes; mkdir -p -f tmp; mirror -R --delete --no-perms out-demo tmp/unitr-demo; bye" "sftp://$SSH_HOST"
          # функция для следующих шагов: команда на хостинге (каталог загружается заново — скрипт удаляет его в конце)
          cat > "$RUNNER_TEMP/host.sh" <<'EOS'
          host() {
            lftp -u "$SSH_USER,$SSHPASS" -e "set sftp:auto-confirm yes; set cmd:fail-exit yes; mkdir -p -f tmp; mirror -R --delete --no-perms out-demo tmp/unitr-demo; bye" "sftp://$SSH_HOST" >/dev/null
            sshpass -e ssh -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "$SSH_USER@$SSH_HOST" "$1 bash tmp/unitr-demo/wp-demo-content.sh"
          }
          # дождаться выкладки на стенд, запущенной после метки времени $1 (событием из WordPress или вручную)
          wait_deploy() {
            local since="$1" id=""
            for _ in $(seq 1 90); do
              id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-static.yml --limit 10 --json databaseId,createdAt,event \
                --jq "[.[] | select(.createdAt > \"$since\" and .event != \"schedule\")] | last | .databaseId // empty")
              [ -n "$id" ] && break
              sleep 10
            done
            [ -n "$id" ] || { echo "выкладка не запустилась"; return 1; }
            echo "выкладка: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
            gh run watch "$id" --repo "$GITHUB_REPOSITORY" --interval 15 >/dev/null 2>&1 || true
          }
          EOS
      - name: WP-CLI (${{ inputs.action }})
        if: contains(fromJSON('["seed","status","remove"]'), inputs.action)
        env:
          ALLOW_SPA: ${{ inputs.allow_spa && 'yes' || '' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "$SSH_USER@$SSH_HOST" \
            "DEMO_MODE=$ACTION ALLOW_SPA=$ALLOW_SPA bash tmp/unitr-demo/wp-demo-content.sh"
      - name: WP-CLI (${{ inputs.action }})
        if: contains(fromJSON('["check","seo-fill","plugin-update","frontend"]'), inputs.action)
        env:
          POST_ID: ${{ inputs.post_id }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "$SSH_USER@$SSH_HOST" \
            "DEMO_MODE=$ACTION DEMO_PHP=wp-stand-scenario.php bash tmp/unitr-demo/wp-demo-content.sh" | tee wp.log
          ! grep -q '^FAIL' wp.log || [ "$ACTION" = check ]
      - name: REST API — настройки WordPress (только чтение)
        if: inputs.action == 'rest'
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "$SSH_USER@$SSH_HOST" \
            "DEMO_MODE=rest DEMO_PHP=wp-stand-scenario.php bash tmp/unitr-demo/wp-demo-content.sh"
      - name: REST API — запросы снаружи
        if: inputs.action == 'rest'
        env:
          WP_GRAPHQL_URL: ${{ secrets.WP_GRAPHQL_URL }}
          WP_GRAPHQL_TOKEN: ${{ secrets.WP_GRAPHQL_TOKEN }}
        run: |
          WP=$(node -e 'console.log(new URL(process.env.WP_GRAPHQL_URL).origin)')
          AUTH="Authorization: Basic $(printf '%s' "$WP_GRAPHQL_TOKEN" | base64 -w0)"
          req() { # метод путь [авторизация] [тело] → «код ответа, code из JSON»
            local m=$1 p=$2 a=${3:-} d=${4:-}
            local args=(-sS -o r.json -w '%{http_code}' -X "$m")
            [ -n "$a" ] && args+=(-H "$AUTH")
            [ -n "$d" ] && args+=(-H 'Content-Type: application/json' --data "$d")
            local c; c=$(curl "${args[@]}" "$WP$p" || true)
            echo "$c $(jq -r 'if type=="object" then (.code // "") else "" end' r.json 2>/dev/null)"
          }
          echo "без авторизации:"
          echo "  GET /wp-json/ → $(req GET /wp-json/)"
          echo "  GET /wp-json/wp/v2/posts → $(req GET '/wp-json/wp/v2/posts?per_page=1')"
          echo "с паролем приложения (Basic Auth):"
          echo "  GET /wp-json/ → $(req GET /wp-json/ 1)"
          echo "  GET /wp-json/wp/v2/users/me → $(req GET /wp-json/wp/v2/users/me 1)"
          echo "  GET /wp-json/wp/v2/posts → $(req GET '/wp-json/wp/v2/posts?per_page=1' 1)"
          echo "  POST /wp-json/wp/v2/posts (черновик) → $(req POST /wp-json/wp/v2/posts 1 '{"title":"Проверка REST API (удаляется автоматически)","status":"draft"}')"
          ID=$(jq -r '.id // empty' r.json 2>/dev/null)
          if [ -n "$ID" ]; then echo "  DELETE /wp-json/wp/v2/posts/<черновик>?force=true → $(req DELETE "/wp-json/wp/v2/posts/$ID?force=true" 1)"; fi
          rm -f r.json
      - name: Резервная копия
        if: inputs.action == 'backup'
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "$SSH_USER@$SSH_HOST" \
            "bash tmp/unitr-demo/backup.sh; rc=\$?; rm -rf tmp/unitr-demo; exit \$rc"
      - name: WP-CLI (post-show)
        if: inputs.action == 'post-show'
        env:
          POST_ID: ${{ inputs.post_id }}
        run: |
          [[ "$POST_ID" =~ ^[0-9]+$ ]] || { echo "post_id — число"; exit 1; }
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "$SSH_USER@$SSH_HOST" \
            "DEMO_MODE=show POST_ID=$POST_ID DEMO_PHP=wp-stand-scenario.php bash tmp/unitr-demo/wp-demo-content.sh"
      - name: Пересборка по событию из WordPress
        if: inputs.action == 'dispatch-setup'
        env:
          WP_DISPATCH_TOKEN: ${{ secrets.WP_DISPATCH_TOKEN }}
        run: |
          [ -n "$WP_DISPATCH_TOKEN" ] || { echo "::error::Нет секрета WP_DISPATCH_TOKEN"; exit 1; }
          printf '%s' "$WP_DISPATCH_TOKEN" | sshpass -e ssh -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "$SSH_USER@$SSH_HOST" \
            "DEMO_MODE=dispatch DISPATCH_REPO=$GITHUB_REPOSITORY DEMO_PHP=wp-stand-scenario.php bash tmp/unitr-demo/wp-demo-content.sh" | tee wp.log
          ! grep -q '^FAIL' wp.log
      - name: Замер автообновления (WordPress → unitr.ru)
        if: inputs.action == 'measure'
        env:
          POST_ID: ${{ inputs.post_id || '147' }}
          PROD: ${{ vars.PROD_SITE_URL || 'https://unitr.ru' }}
        run: |
          [[ "$POST_ID" =~ ^[0-9]+$ ]] || { echo "post_id — число"; exit 1; }
          T0=$(date -u +%Y-%m-%dT%H:%M:%SZ); S0=$(date +%s)
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "$SSH_USER@$SSH_HOST" \
            "DEMO_MODE=touch POST_ID=$POST_ID DEMO_PHP=wp-stand-scenario.php bash tmp/unitr-demo/wp-demo-content.sh" | tee touch.log
          grep -q '^PASS' touch.log || exit 1
          SLUG=$(sed -n 's/^TOUCH //p' touch.log | jq -r .slug); MOD=$(sed -n 's/^TOUCH //p' touch.log | jq -r .modified)
          echo "статья $SLUG, новая дата изменения $MOD (UTC)"
          RUN=""; PAGE=""; MAP=""
          for i in $(seq 1 120); do
            [ -n "$RUN" ] || RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-static.yml --event repository_dispatch --limit 5 --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$T0\")] | last | .databaseId // empty")
            if [ -z "$PAGE" ] && curl -sf -m 20 "$PROD/articles/$SLUG/" | grep -q "\"dateModified\":\"$MOD"; then PAGE=$(( $(date +%s) - S0 )); fi
            if [ -z "$MAP" ]; then
              # sitemap.xml — список адресов или индекс (тогда — его части из /sitemaps/)
              SM=$(curl -sf -m 20 "$PROD/sitemap.xml"); ALL=$SM
              for l in $(echo "$SM" | grep -oE '<loc>[^<]+/sitemaps/[^<]+</loc>' | sed 's/<[^>]*>//g'); do ALL="$ALL$(curl -sf -m 20 "$l")"; done
              echo "$ALL" | tr -d '\n ' | grep -q "/articles/$SLUG/</loc><lastmod>$MOD" && MAP=$(( $(date +%s) - S0 ))
            fi
            [ -n "$PAGE" ] && [ -n "$MAP" ] && break
            sleep 10
          done
          echo "выкладка по событию: ${RUN:+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN}"
          fmt() { [ -n "$1" ] && printf '%d мин %02d с' $(( $1 / 60 )) $(( $1 % 60 )) || echo "не дождались за 20 мин"; }
          echo "Страница статьи на $PROD: $(fmt "$PAGE")"
          echo "sitemap.xml на $PROD: $(fmt "$MAP")"
          [ -n "$PAGE" ] && [ -n "$MAP" ] && [ "$PAGE" -le 900 ] && [ "$MAP" -le 900 ] && echo "PASS ≤ 15 минут" || { echo "FAIL"; exit 1; }
      - name: Сценарий ручных пунктов Прил. № 4
        if: inputs.action == 'scenario'
        env:
          BASIC_AUTH: ${{ secrets.STAND_AUTH }}
        run: |
          . "$RUNNER_TEMP/host.sh"
          T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "$SSH_USER@$SSH_HOST" \
            "DEMO_MODE=apply DEMO_PHP=wp-stand-scenario.php bash tmp/unitr-demo/wp-demo-content.sh" | tee apply.log
          SCENARIO=$(sed -n 's/^SCENARIO //p' apply.log)
          [ -n "$SCENARIO" ] || exit 1
          # выкладку запускает событие из WordPress (если настроено); если за 2 минуты не запустилась — вручную
          sleep 120
          if ! gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-static.yml --limit 5 --json createdAt,event --jq ".[] | select(.createdAt > \"$T0\" and .event == \"repository_dispatch\")" | grep -q .; then
            echo "событие из WordPress не пришло — выкладка вручную"
            gh workflow run deploy-static.yml --repo "$GITHUB_REPOSITORY" -f target=test
          else
            echo "выкладку запустило событие из WordPress"
          fi
          wait_deploy "$T0"
          RC=0
          node scripts/check-scenario.mjs "$SITE_URL" "$SCENARIO" --report=scenario.md || RC=$?
          echo "== Откат изменений"
          host "DEMO_MODE=revert DEMO_PHP=wp-stand-scenario.php"
          T1=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sleep 5
          gh workflow run deploy-static.yml --repo "$GITHUB_REPOSITORY" -f target=test
          wait_deploy "$T1"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-static.yml --limit 1 --json conclusion,url --jq '"выкладка после отката: \(.[0].conclusion) \(.[0].url)"'
          cat scenario.md >> "$GITHUB_STEP_SUMMARY"
          exit $RC
      - name: Обновить стенд (и боевой сайт после апрува)
        if: contains(fromJSON('["seed","remove","seo-fill"]'), inputs.action)
        env:
          PROD_APPROVED: ${{ vars.PROD_APPROVED }}
        run: |
          gh workflow run deploy-static.yml --repo "$GITHUB_REPOSITORY" -f target=test
          [ "$PROD_APPROVED" != yes ] || gh workflow run deploy-static.yml --repo "$GITHUB_REPOSITORY" -f target=production
