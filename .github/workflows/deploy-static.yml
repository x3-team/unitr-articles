# Раздел «Статьи» для shared-хостинга Reg.ru (Node.js на хостинге — v10, Next.js там не запустить):
# GitHub Actions собирает HTML раздела из WordPress (SSR-пререндер) и выкладывает по SFTP; 301/404 — .htaccess.
#
# Цели:
#   test       — тестовый стенд (vars.STAND_URL / vars.STAND_DIR, Basic Auth из secrets.STAND_AUTH);
#   production — боевой unitr.ru. Только после апрува заказчика (vars.PROD_APPROVED=yes); вручную — target=production.
# По событию из WordPress (repository_dispatch) и по расписанию (раз в час — подстраховка, если событие не дошло) обновляются цели из
# vars.DEPLOY_TARGETS (например ["test"]) и, при vars.PROD_APPROVED=yes, production.
#
# Секреты: WP_GRAPHQL_URL, WP_GRAPHQL_TOKEN (пароль приложения WP; только при сборке, на хостинг не попадает),
# HOSTING_SSH_HOST, HOSTING_SSH_USER, HOSTING_SSH_PASSWORD.
name: Deploy unitr.ru (static)

on:
  schedule:
    # раз в час, в 17 минут: основное обновление — событие из WordPress (2–3 минуты); расписание «каждые 10 минут»
    # GitHub на деле запускал раз в 4–6 часов
    - cron: "17 * * * *"
  repository_dispatch:
    types: [wp-content-changed]
  workflow_dispatch:
    inputs:
      target:
        description: Куда выкладывать
        type: choice
        options: [test, production]
        default: test
      dry_run:
        description: Только показать, что изменится на хостинге
        type: boolean
        default: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.t.outputs.list }}
    steps:
      - id: t
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.target }}
          CONFIGURED: ${{ vars.DEPLOY_TARGETS || '[]' }}
          PROD_APPROVED: ${{ vars.PROD_APPROVED }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then echo "list=[\"$INPUT\"]" >> "$GITHUB_OUTPUT"
          # после апрува заказчика боевой сайт обновляется сам: по событию из WordPress и по расписанию
          elif [ "$PROD_APPROVED" = yes ]; then echo "list=$(jq -c '. + ["production"] | unique' <<< "$CONFIGURED")" >> "$GITHUB_OUTPUT"
          else echo "list=$CONFIGURED" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: targets
    if: needs.targets.outputs.list != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    concurrency:
      group: deploy-static-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04  # Playwright 1.56 ставит зависимости Chromium только на 24.04
    env:
      SITE_URL: ${{ matrix.target == 'production' && (vars.PROD_SITE_URL || 'https://unitr.ru') || (vars.STAND_URL || 'https://test.unitr.ru') }}
      DEPLOY_PATH: ${{ matrix.target == 'production' && (vars.PROD_DIR || 'www/unitr.ru') || (vars.STAND_DIR || 'www/test.unitr.ru') }}
    steps:
      - name: Прод — только после апрува заказчика
        if: matrix.target == 'production' && vars.PROD_APPROVED != 'yes'
        run: |
          echo "::error::Выкладка на боевой unitr.ru заблокирована: нет апрува заказчика (vars.PROD_APPROVED != yes)"
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y -q lftp >/dev/null
      - name: Страницы и robots.txt основного сайта (до выкладки раздела)
        # исходные sitemap.xml и robots.txt SPA (боевой каталог; копии *.before-unitr-articles после первой выкладки):
        # страницы сайта остаются в карте сайта, правила robots.txt сохраняются
        env:
          SRC_DIR: ${{ vars.PROD_DIR || 'www/unitr.ru' }}
          DEPLOY_HOST: ${{ secrets.HOSTING_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.HOSTING_SSH_USER }}
          DEPLOY_PASSWORD: ${{ secrets.HOSTING_SSH_PASSWORD }}
          CONFIGURED_PAGES: ${{ vars.SITE_STATIC_PAGES }}
        run: |
          mkdir -p site-original && cd site-original
          for f in sitemap.xml robots.txt; do
            lftp -u "$DEPLOY_USER,$DEPLOY_PASSWORD" -e "set sftp:auto-confirm yes; cd $SRC_DIR; get -e $f.before-unitr-articles -o $f; bye" "sftp://$DEPLOY_HOST" >/dev/null 2>&1 \
              || lftp -u "$DEPLOY_USER,$DEPLOY_PASSWORD" -e "set sftp:auto-confirm yes; cd $SRC_DIR; get -e $f; bye" "sftp://$DEPLOY_HOST" >/dev/null 2>&1 || true
          done
          # уже карта раздела / robots раздела — это не исходные файлы сайта
          grep -q "/sitemaps/" sitemap.xml 2>/dev/null && rm -f sitemap.xml
          grep -qi "^Allow: /articles/" robots.txt 2>/dev/null && ! grep -qi "^User-agent: Yandex" robots.txt && rm -f robots.txt
          cd ..
          if [ -z "$CONFIGURED_PAGES" ] && [ -s site-original/sitemap.xml ]; then
            PAGES=$(node scripts/site-pages-from-sitemap.mjs site-original/sitemap.xml)
            echo "SITE_STATIC_PAGES=$PAGES" >> "$GITHUB_ENV"
            echo "SITE_PAGES_SOURCE=static" >> "$GITHUB_ENV"
            echo "страниц сайта из исходной карты: $(echo "$PAGES" | grep -o '"path"' | wc -l)"
          else
            echo "исходная карта сайта не найдена — страницы сайта из настроек / WordPress"
            echo "SITE_STATIC_PAGES=$CONFIGURED_PAGES" >> "$GITHUB_ENV"
          fi
          [ -s site-original/robots.txt ] && echo "исходный robots.txt: $(grep -ci '^user-agent' site-original/robots.txt) групп User-agent" || echo "исходный robots.txt не найден"
      - name: Сборка из WordPress (manage.unitr.ru)
        run: npm run build:pages
        env:
          STATIC_EXPORT: "1"
          EXPORT_TARGET: apache
          ASSET_PREFIX: /articles/_media
          BASE_PATH: ""
          BUILD_ID: ${{ github.sha }}
          CONTENT_SOURCE: graphql
          WP_GRAPHQL_URL: ${{ secrets.WP_GRAPHQL_URL }}
          WP_GRAPHQL_TOKEN: ${{ secrets.WP_GRAPHQL_TOKEN }}
          WP_GRAPHQL_AUTH: ${{ vars.WP_GRAPHQL_AUTH || 'basic' }}
          ARTICLES_CATEGORY: ${{ vars.ARTICLES_CATEGORY || 'poleznye-stati' }}
          ROBOTS_EXTRA: ${{ vars.ROBOTS_EXTRA }}
      - name: Токен WordPress не попал в файлы сайта
        env:
          WP_GRAPHQL_TOKEN: ${{ secrets.WP_GRAPHQL_TOKEN }}
        run: |
          if [ -n "$WP_GRAPHQL_TOKEN" ] && grep -rqF -- "$WP_GRAPHQL_TOKEN" out-apache; then echo "::error::Токен найден в файлах сайта"; exit 1; fi
          if grep -rqE "manage\.unitr\.ru/graphql" out-apache; then echo "::error::Адрес GraphQL найден в файлах сайта"; exit 1; fi
      - name: Выкладка по SFTP
        run: ./scripts/deploy-static.sh
        env:
          DEPLOY_PROTOCOL: sftp
          DEPLOY_HOST: ${{ secrets.HOSTING_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.HOSTING_SSH_USER }}
          DEPLOY_PASSWORD: ${{ secrets.HOSTING_SSH_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          BUILD_ID: ${{ github.sha }}
      - name: Проверка критериев приёмки (Прил. № 4)
        if: github.event_name != 'schedule' && !inputs.dry_run
        run: node scripts/check-acceptance.mjs "$SITE_URL" --mode=static --report=acceptance.md ${{ matrix.target == 'test' && '--stand' || '' }}
        env:
          SECRET_VALUES: ${{ secrets.WP_GRAPHQL_TOKEN }}
          BASIC_AUTH: ${{ matrix.target == 'test' && secrets.STAND_AUTH || '' }}
      - name: Пункт «Статьи» в меню SPA (браузер)
        if: github.event_name != 'schedule' && !inputs.dry_run
        run: |
          npm i --no-save --no-package-lock playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node scripts/check-spa-menu.mjs "$SITE_URL" --report=menu.md
        env:
          BASIC_AUTH: ${{ matrix.target == 'test' && secrets.STAND_AUTH || '' }}
      - if: always() && github.event_name != 'schedule'
        run: cat acceptance.md menu.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
